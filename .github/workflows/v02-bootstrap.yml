name: Import v0.2 source
on:
  push:
    branches: [feature/psp-v0.2]
    paths: ['.bootstrap/READY']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part1 .bootstrap/part2 .bootstrap/part3 .bootstrap/part4 | base64 --decode | tar -xJf - -C .
          test -f src/core/EngineSimulation.cpp
          test -f src/ui/GameApp.cpp
          test -f docs/mission-002.md
          rm -rf .bootstrap
          git status --short
      - name: Commit on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: Mission 002 LO troubleshooting and standby transfer"
          git push origin HEAD:feature/psp-v0.2
