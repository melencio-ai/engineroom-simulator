name: Engine Watch CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure headless simulation tests
        run: cmake -S . -B build/tests -DENGINEWATCH_BUILD_GAME=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/tests --parallel 2
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

  psp-eboot:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure PSP build
        run: psp-cmake -S . -B build/psp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build EBOOT
        run: cmake --build build/psp --parallel 2
      - name: Package playable output
        run: |
          test -f build/psp/EBOOT.PBP
          mkdir -p dist/PSP/GAME/ENGINEWATCH
          cp build/psp/EBOOT.PBP dist/PSP/GAME/ENGINEWATCH/EBOOT.PBP
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-psp-v0.1
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ppsspp-smoke:
    runs-on: ubuntu-latest
    needs: psp-eboot
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-watch-psp-v0.1
          path: game/
      - name: Install virtual display and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri
      - name: Get official PPSSPP AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.20.4 --repo hrydgard/ppsspp --pattern "PPSSPP-v1.20.4-anylinux-x86_64.AppImage" --dir /tmp
          chmod +x /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage --appimage-extract >/dev/null
      - name: Boot PPSSPP and capture framebuffer
        shell: bash
        run: |
          mkdir -p diagnostics
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            ./squashfs-root/AppRun --windowed game/PSP/GAME/ENGINEWATCH/EBOOT.PBP >diagnostics/ppsspp.log 2>&1 &
            pid=$!
            sleep 14
            import -window root diagnostics/screen.png
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
          '
          identify diagnostics/screen.png
          tail -n 100 diagnostics/ppsspp.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppsspp-screen-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
