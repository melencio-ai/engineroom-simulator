name: Engine Watch G3.7.1 Marine Engineer Humanoid Quality and PSP CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [develop, main, 'feature/**']
  workflow_dispatch:


jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema Draft 2020-12 validation dependency
        run: python -m pip install "jsonschema>=4.20,<5"
      - name: Validate catalog schema, traceability, size rules and IDs
        run: python tools/asset_pipeline/validate_catalog.py
      - name: Test invalid dimensions, provenance and connection graphs
        run: python -m unittest discover -s tests/catalog -p 'test_*.py' -v
      - name: Export separate inspection GLB OBJ and PSP optimized meshes
        run: python tools/asset_pipeline/export_catalog.py --out dist/parametric-catalog
      - name: Verify generated PSP vertex streams with the C++11 runtime layout
        run: |
          mkdir -p build/catalog
          g++ -std=c++11 -Wall -Wextra -pedantic -Isrc tools/asset_pipeline/verify_ewmesh.cpp -o build/catalog/verify_ewmesh
          build/catalog/verify_ewmesh dist/parametric-catalog/psp/*.ewmesh
      - name: Export independent assembled and exploded marine joints
        run: python tools/asset_pipeline/export_assemblies.py --out dist/marine-assemblies
      - name: Validate standalone WebGL viewer JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path("dist/marine-assemblies").glob("*/viewer.html"))
          assert len(files)==2
          for n,file in enumerate(files):
              html=file.read_text(encoding="utf-8")
              code=html.split("<script>\n",1)[1].split("\n</script>",1)[0]
              path=Path("build/catalog")/f"assembly-viewer-{n}.js"
              path.write_text(code,encoding="utf-8")
              assert "https://" not in code and "http://" not in code
          print("Offline WebGL inspection scripts extracted: 2")
          PY
          node --check build/catalog/assembly-viewer-0.js
          node --check build/catalog/assembly-viewer-1.js
      - name: Validate assembly C++11 PSP geometry batches
        run: build/catalog/verify_ewmesh dist/marine-assemblies/*/psp/*.ewmesh
      - name: Confirm resolved assemblies, per-instance GLBs and standalone viewers
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("dist/marine-assemblies")
          data=json.load(open(root/"assemblies.json"))
          assert len(data["generated"])==2
          assert data["deferred_unresolved"]==["ASM.LO.PUMP.SKID.DEMO.001"]
          for rec in data["generated"]:
              path=root/rec["id"]
              manifest=json.load(open(path/"manifest.json"))
              assert path.joinpath("viewer.html").is_file()
              assert path.joinpath("assembled.glb").is_file()
              assert path.joinpath("exploded.glb").is_file()
              assert manifest["instance_count"]==rec["instances"]
              assert all(chunk["triangles"]<=1800 for chunk in manifest["psp_chunks"])
          print("G2b assembled/exploded GLB, interactive viewers and PSP batches: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-marine-assemblies-g2b
          path: dist/marine-assemblies/
          if-no-files-found: error
          retention-days: 14
      - name: Check complete catalog artifact and illustrative source status
        run: |
          python -c 'import json,pathlib; d=json.load(open("dist/parametric-catalog/manifest.json")); assert d["component_count"]==10; assert all(not p["engineering_verified"] and p["psp_triangles"]<=1800 for p in d["components"]); assert len(list(pathlib.Path("dist/parametric-catalog/inspection").glob("*.glb")))==10; print("G2 inspection and PSP assets validated")'
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-parametric-marine-components-g2
          path: dist/parametric-catalog/
          if-no-files-found: error
          retention-days: 14

  marine-component-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable marine 3D OBJ exporter
        run: cmake -S . -B build/objects -DENGINEWATCH_BUILD_GAME=OFF -DBUILD_TESTING=OFF -DENGINEWATCH_EXPORT_ASSETS=ON -DENGINEWATCH_EXPORT_DECKPLAN=ON -DENGINEWATCH_EXPORT_CHARACTER=ON
      - name: Build native 3D component exporter
        run: cmake --build build/objects --parallel 2
      - name: Export 33 separate OBJ/MTL meshes
        run: |
          mkdir -p dist/marine-objects
          ./build/objects/enginewatch_export_parts dist/marine-objects
          test "$(find dist/marine-objects -name '*.obj' | wc -l)" -eq 33
          test "$(find dist/marine-objects -name '*.mtl' | wc -l)" -eq 33
          cp docs/marine-asset-catalog.md dist/marine-objects/README.md
          cp assets/marine_parts/catalog.json dist/marine-objects/catalog.json
          python3 -c 'import json,os; p="dist/marine-objects/"; d=json.load(open(p+"catalog.json")); assert len(d["parts"])==33; assert len(d["finishes"])==16; assert all(os.path.isfile(p+x["obj_file"]) and os.path.isfile(p+x["mtl_file"]) for x in d["parts"]); print("33 OBJ+MTL models and 16 finishes verified")'
      - name: Export G3 shared-deck JSON and five SVG construction plans
        run: |
          mkdir -p dist/deck-constructor
          ./build/objects/enginewatch_export_deckplan dist/deck-constructor
      - name: Verify deck cells, grating coverage and readable SVG layouts
        run: |
          python3 - <<'PY'
          import collections,json,pathlib,xml.etree.ElementTree as XML
          root=pathlib.Path("dist/deck-constructor")
          data=json.load(open(root/"deck-constructor.json"))
          assert data["format"]=="engine-watch-deckplan/1"
          assert len(data["decks"])==5
          assert len(data["cells"])==79
          assert len(data["openings"])==12
          assert len(data["grating_bands"])==8
          kinds=collections.Counter(c["surface"] for c in data["cells"])
          assert kinds=={"solid_steel_plate":46,"open_steel_grating":32,"inset_service_cover":1},kinds
          for deck in range(5):
              path=root/f"deck-0{deck}.svg"
              assert path.is_file()
              doc=XML.parse(path)
              assert doc.getroot().tag.endswith("svg")
              assert sum(c["deck"]==deck for c in data["cells"])>0
          print("G3 export check: 79 floor cells, 12 declared cutouts, 8 grating bands, 5 valid SVG plans")
          PY
      - name: Generate low-poly marine engineer and six inspection poses
        run: |
          mkdir -p dist/marine-engineer
          ./build/objects/enginewatch_export_character dist/marine-engineer
      - name: Verify standalone human mesh exports and runtime constraints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("dist/marine-engineer")
          profile=json.loads((root/"profile.json").read_text())
          poses=sorted(root.glob("*.obj"))
          assert len(poses)==6,poses
          assert profile["body_height_m"]>profile["eye_height_m"]
          assert profile["max_runtime_vertices"]==3000
          assert profile["idle_body_triangles"]*3 <=3000
          assert profile["first_person_hand_triangles"]*3 <=3000
          assert profile["first_person_hand_triangles"]>72
          assert profile["idle_body_triangles"]>312
          assert (root/"marine_engineer.mtl").exists()
          for pose in poses:
              txt=pose.read_text()
              assert "mtllib marine_engineer.mtl" in txt
              assert sum(line.startswith("v ") for line in txt.splitlines())>100
              assert "usemtl" in txt
          print("G3.5: six OBJ poses, colours/PPE and transient character budget PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-marine-engineer-character-g352
          path: dist/marine-engineer/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-deck-constructor-g3
          path: dist/deck-constructor/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-reusable-3d-objects-v0.7.1
          path: dist/marine-objects/
          if-no-files-found: error
          retention-days: 14

  scene-and-simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure headless tests
        run: cmake -S . -B build/tests -DENGINEWATCH_BUILD_GAME=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/tests --parallel 2
      - name: Test simulation and 3D world
        run: ctest --test-dir build/tests --output-on-failure
      - name: Enforce PSP near-plane clipping render contract
        run: python3 tools/verify_psp_render_state.py
      - name: Print scene mesh budget for PSP guardband analysis
        run: build/tests/enginewatch_world_tests 2>&1 | grep -E 'PSP mesh budget|vertices /|raised deck'

  desktop-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and OpenGL development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libgl1-mesa-dev
      - name: Configure desktop 3D preview
        run: cmake -S . -B build/desktop -DENGINEWATCH_BUILD_GAME=ON -DBUILD_TESTING=ON
      - name: Build 3D desktop application
        run: cmake --build build/desktop --parallel 2
      - name: Test
        run: ctest --test-dir build/desktop --output-on-failure

  quaternius-worker-import:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Download one pinned Quaternius CC0 Worker GLB (not whole character pack)
        run: |
          mkdir -p build/humanoid
          curl --fail --location --retry 4 --retry-delay 3 \
            --output build/humanoid/Worker.glb \
            https://raw.githubusercontent.com/LuanDucate/Ducz.CharacterCreator/main/public/models/Male/Worker.glb
          python3 tools/humanoid/inspect_source.py \
            --source build/humanoid/Worker.glb --report build/humanoid/source_provenance.json
      - name: Install headless Blender rig and animation baker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --version | head -n 2
      - name: Bake REAL rigged Idle Walk and Interact source clips to PSP LOD
        run: |
          python3 -m py_compile tools/humanoid/bake_worker.py
          mkdir -p assets/generated
          blender -b -t 2 --python tools/humanoid/bake_worker.py -- \
            --input build/humanoid/Worker.glb \
            --output assets/generated/ENGINEER.EWM \
            --manifest assets/generated/manifest.json \
            --triangles 900
          test -s assets/generated/ENGINEER.EWM
          test -s assets/generated/manifest.json
      - name: Verify source animated (not static), fits PSP vertex/memory budgets
        run: |
          python3 tools/humanoid/verify_ewmh.py assets/generated/ENGINEER.EWM \
            --report assets/generated/validation.json
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("assets/generated")
          profile=json.load(open(root/"manifest.json"))
          source=json.load(open("build/humanoid/source_provenance.json"))
          assert 650<=profile["psp_triangles"]<=900
          assert profile["original_triangles"]>profile["psp_triangles"]
          assert profile["psp_vertices_per_frame"]<=3000
          assert source["rig_count"]>=1
          assert "Idle" in " ".join(source["animations"])
          assert profile["ewmh_file_bytes"]<1350000
          assert profile["stable_triangle_correspondence"]
          assert profile["root_motion_source"]=="original Hips bone"
          assert len(profile["mesh_lod_allocation"])==source["mesh_count"]
          assert sum(x["result_triangles"] for x in profile["mesh_lod_allocation"])==profile["psp_triangles"]
          report=json.load(open(root/"validation.json"))
          assert report["degenerate_triangle_ratio"]<0.025
          assert report["largest_adjacent_frame_vertex_step_m"]<0.87
          assert report["stable_face_colours"]
          assert report["unique_palette_colors"]<=100
          print("G3.7.1 preserved anatomy, PPE palette and stable animation PASS")
          PY
          cp build/humanoid/source_provenance.json assets/generated/source_provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-g371-anatomy-preserved-worker
          path: assets/generated/
          if-no-files-found: error
          retention-days: 14

  psp-eboot:
    runs-on: ubuntu-latest
    needs: quaternius-worker-import
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-watch-g371-anatomy-preserved-worker
          path: assets/generated
      - name: Confirm verified Worker sidecar is staged in PSP toolchain
        run: |
          test -s assets/generated/ENGINEER.EWM
          test -s assets/generated/validation.json
          test -s assets/generated/manifest.json
      - name: Configure PSP native 3D build
        run: psp-cmake -S . -B build/psp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Compile PSP GU/GUM 3D marine materials executable
        run: cmake --build build/psp --parallel 2
      - name: Package EBOOT
        run: |
          test -f build/psp/EBOOT.PBP
          mkdir -p dist/PSP/GAME/ENGINEWATCH
          cp build/psp/EBOOT.PBP dist/PSP/GAME/ENGINEWATCH/EBOOT.PBP
          cp assets/generated/ENGINEER.EWM dist/PSP/GAME/ENGINEWATCH/ENGINEER.EWM
      - uses: actions/upload-artifact@v4
        with:
          name: engine-watch-psp-g371-humanoid-quality-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ppsspp-smoke:
    runs-on: ubuntu-latest
    needs: psp-eboot
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-watch-psp-g371-humanoid-quality-preview
          path: game/
      - name: Install PPSSPP dependencies and screenshot utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri pulseaudio pulseaudio-utils
      - name: Download official PPSSPP AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.20.4 --repo hrydgard/ppsspp --pattern "PPSSPP-v1.20.4-anylinux-x86_64.AppImage" --dir /tmp
          chmod +x /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage --appimage-extract >/dev/null
      - name: Boot 3D engine room and capture framebuffer
        shell: bash
        run: |
          mkdir -p diagnostics "$HOME/.config/ppsspp/PSP/GAME/ENGINEWATCH"
          cp game/PSP/GAME/ENGINEWATCH/EBOOT.PBP "$HOME/.config/ppsspp/PSP/GAME/ENGINEWATCH/EBOOT.PBP"
          cp game/PSP/GAME/ENGINEWATCH/ENGINEER.EWM "$HOME/.config/ppsspp/PSP/GAME/ENGINEWATCH/ENGINEER.EWM"
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            pulseaudio --start --exit-idle-time=-1 >/tmp/pulse-start.log 2>&1 || true
            pactl load-module module-null-sink sink_name=ppsspp_ci_sink >/tmp/pulse-sink.log 2>&1 || true
            export SDL_AUDIODRIVER=pulseaudio
            ./squashfs-root/AppRun --windowed "$HOME/.config/ppsspp/PSP/GAME/ENGINEWATCH/EBOOT.PBP" >diagnostics/ppsspp.log 2>&1 &
            pid=$!
            sleep 14
            import -window root diagnostics/screen.png
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
          '
          identify diagnostics/screen.png
          tail -n 100 diagnostics/ppsspp.log
          if grep -q 'Boot failed' diagnostics/ppsspp.log; then echo 'PPSSPP boot failed'; exit 1; fi
          if ! grep -q 'Booted .*ENGINEWATCH/EBOOT.PBP' diagnostics/ppsspp.log; then
            echo 'PPSSPP did not boot the PSP game'; exit 1
          fi
          unique_colors=$(identify -format '%k' diagnostics/screen.png)
          if [ "$unique_colors" -lt 20 ]; then
            echo '3D scene appears blank or has too few visible colours'
            exit 1
          fi
          echo "3D smoke frame captured ($unique_colors unique colours)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppsspp-g371-humanoid-quality-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
